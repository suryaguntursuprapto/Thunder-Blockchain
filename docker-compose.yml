version: '3.8'

services:
  # Bootnode (Genesis Node)
  bootnode:
    image: thunder_node:latest
    container_name: thunder_bootnode
    ports:
      - "9000:9000"  # P2P
      - "8080:8080"  # RPC API
    volumes:
      - bootnode_data:/app/node_data
    command: ["--port", "9000"]
    restart: always

volumes:
  bootnode_data:
