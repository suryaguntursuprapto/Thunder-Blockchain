version: '3.8'

services:
  # Bootnode (Genesis Node)
  bootnode:
    build: .
    image: thunder-node:latest
    container_name: thunder_bootnode
    ports:
      - "9000:9000"  # P2P
      - "8080:8080"  # RPC API
    volumes:
      - bootnode_data:/app/node_data
    command: ["--port", "9000"]
    restart: always

  # Validator 2
  validator2:
    build: .
    image: thunder-node:latest
    container_name: thunder_validator2
    ports:
      - "9001:9000"
      - "8081:8080"
    volumes:
      - validator2_data:/app/node_data
    depends_on:
      - bootnode
    command: ["--port", "9000", "--bootnode", "http://bootnode:9000"]
    restart: always

