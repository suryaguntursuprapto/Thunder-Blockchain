name: Thunder Continuous Integration

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build & Test 🚀
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo via rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "thunder-rocksdb-cache"

      - name: Build Workspace
        run: cargo build --workspace --verbose

      - name: Run Tests
        run: cargo test --workspace --verbose

  security_audit:
    name: Security & Linters 🛡️
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo via rust-cache
        uses: Swatinem/rust-cache@v2
        
      - name: Run Format Check
        run: cargo fmt --all -- --check

      - name: Run Cargo Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Install Cargo Audit
        run: cargo install cargo-audit

      - name: Run Security Vulnerability Audit
        run: cargo audit

  docker_build_and_push:
    name: Build & Push Docker Image 🐳
    needs: [build_and_test, security_audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build Docker Image
        run: docker build -t ghcr.io/${{ env.REPO_LC }}/thunder-node:latest -t ghcr.io/${{ env.REPO_LC }}/thunder-node:${{ github.sha }} .

      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ env.REPO_LC }}/thunder-node:latest
          docker push ghcr.io/${{ env.REPO_LC }}/thunder-node:${{ github.sha }}

  release:
    name: Create GitHub Release 📦
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_and_test, security_audit, docker_build_and_push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo via rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release -p thunder-cli

      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/thunder-cli dist/
          tar -czvf thunder-cli-linux-x86_64.tar.gz -C dist thunder-cli
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: thunder-cli-linux-x86_64.tar.gz
          generate_release_notes: true
