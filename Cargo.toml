[workspace]
resolver = "2"
members = [
    "Core-Engine/thunder-core",
    "Core-Engine/thunder-consensus",
    "Core-Engine/thunder-network",
    "Core-Engine/thunder-vm",
    "Core-Engine/thunder-lang",
    "Core-Engine/thunder-rpc",
    "Core-Engine/thunder-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Thunder Blockchain Contributors"]

[workspace.dependencies]
ed25519-dalek = { version = "^2.0.0", features = ["rand_core"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# Storage
rusty-leveldb = "3.0"

# Networking
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "kad",
    "noise",
    "tcp",
    "yamux",
    "identify",
    "macros",
] }
tokio = { version = "1.0", features = ["full"] }

# CLI & API
clap = { version = "4.0", features = ["derive"] }
warp = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Misc
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
